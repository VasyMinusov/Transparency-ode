[project]
name = "transparency-api"
version = "0.1.0"
description = "Код прозрачности — аналитическое API для подразделений по профилактике коррупционных правонарушений"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "networkx>=3.4",
    "numpy>=2.1",
    "pandas>=2.2",
    "xgboost>=2.1",
    "shap>=0.46",
    "scikit-learn>=1.5",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
